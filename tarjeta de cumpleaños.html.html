<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Mi Fiesta de Cumpleaños!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #e0f2fe, #bae6fd, #fef08a);
            font-family: 'Arial Rounded MT Bold', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding: 20px 0;
        }

        /* Fondo Animado de Confeti y Globos */
        .decorations-container {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: fall 4s linear infinite;
            opacity: 0.8;
        }

        .balloon {
            position: absolute;
            width: 30px;
            height: 40px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            animation: floatUp 8s linear infinite;
            bottom: -50px;
            opacity: 0.7;
        }

        .balloon::after {
            content: "🎈";
            font-size: 2rem;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Tarjeta Principal */
        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border-radius: 30px;
            padding: 35px 25px;
            width: 90%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(14, 165, 233, 0.25);
            border: 4px solid #38bdf8;
            z-index: 10;
            position: relative;
        }

        /* Guirnalda decorativa superior */
        .banner-decor {
            font-size: 1.8rem;
            letter-spacing: 5px;
            margin-bottom: 15px;
            display: block;
        }

        /* Contenedor de la foto en el medio */
        .photo-container {
            position: relative;
            width: 170px;
            height: 170px;
            margin: 0 auto 20px auto;
        }

        .photo-frame {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 6px solid #0ea5e9;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            background: #fff;
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Gorrito de fiesta sobre la foto */
        .party-hat {
            position: absolute;
            top: -28px;
            left: 50%;
            transform: translateX(-50%) rotate(-10deg);
            font-size: 3rem;
            z-index: 12;
        }

        /* Textos */
        h1 {
            color: #0284c7;
            font-size: 2.3rem;
            margin-bottom: 5px;
            text-transform: uppercase;
            -webkit-text-stroke: 1px #fff;
        }

        .age-badge {
            background-color: #facc15;
            color: #0f172a;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 15px;
            font-size: 1.1rem;
            box-shadow: 0 4px 10px rgba(250, 204, 21, 0.4);
        }

        .invitation-text {
            color: #475569;
            font-size: 1.05rem;
            line-height: 1.4;
            margin-bottom: 25px;
            font-weight: 500;
        }

        /* Bloque de Información de la Fiesta */
        .info-section {
            background: #f0fdf4;
            border: 2px dashed #4ade80;
            border-radius: 20px;
            padding: 20px 15px;
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: left;
            color: #1e293b;
            font-size: 1rem;
        }

        .info-icon {
            font-size: 1.6rem;
            background: #ffffff;
            padding: 6px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            min-width: 42px;
            text-align: center;
        }

        .info-text strong {
            color: #166534;
            display: block;
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        /* Botones de acción */
        .btn-whatsapp {
            background-color: #25d366;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 50px;
            display: block;
            font-weight: bold;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(37, 211, 102, 0.3);
            transition: transform 0.2s;
        }

        .btn-whatsapp:hover {
            transform: scale(1.03);
        }

        /* Reproductor de Música */
        .music-player {
            background: #0ea5e9;
            border-radius: 50px;
            padding: 10px 20px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(14, 165, 233, 0.4);
            border: none;
            color: white;
            font-weight: bold;
            font-size: 0.95rem;
        }

        .music-player:hover {
            background: #0284c7;
        }

        .music-player svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* Animaciones */
        @keyframes fall {
            0% { transform: translateY(-20px) rotate(0deg); top: -5%; }
            100% { transform: translateY(105vh) rotate(360deg); top: 105%; }
        }

        @keyframes floatUp {
            0% { bottom: -10%; transform: translateX(0); }
            50% { transform: translateX(20px); }
            100% { bottom: 110%; transform: translateX(-20px); }
        }
    </style>
</head>
<body>

    <div class="decorations-container" id="decorations"></div>

    <div class="card">
        <span class="banner-decor">🎉✨🎁✨🎉</span>
        
        <div class="photo-container">
            <div class="party-hat">🥳</div>
            <div class="photo-frame">
                <img src="mi_foto.jpeg" alt="Imagen de whatsapp">
            </div>
        </div>

        <h1>¡Parquer!</h1>
        <div class="age-badge">¡Cumplo 1 Año! 🎂</div>
        
        <p class="invitation-text">¡Te invito a celebrar conmigo un día lleno de diversión, juegos y muchos dulces! No faltes.</p>

        <div class="info-section">
            <div class="info-item">
                <div class="info-icon">📅</div>
                <div class="info-text">
                    <strong>Fecha</strong>
                    Lunes, 13 de Julio
                </div>
            </div>
            <div class="info-item">
                <div class="info-icon">⏰</div>
                <div class="info-text">
                    <strong>Hora</strong>
                    6:00 PM
                </div>
            </div>
            <div class="info-item">
                <div class="info-icon">📍</div>
                <div class="info-text">
                    <strong>Lugar</strong>
                    P.j Villa Floria (Alto Selva Alegre)
                </div>
            </div>
        </div>

        <a href="https://wa.me/51958893650?text=¡Hola!+Confirmo+mi+asistencia+al+cumpleaños" target="_blank" class="btn-whatsapp">
            Confirmar Asistencia por WhatsApp 📱
        </a>
		
        <button class="music-player" id="musicBtn">
            <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            <span id="btnText">Escuchar Música</span>
        </button>

        <audio id="bgMusic" loop>
            <source src="https://www.youtube.com/watch?v=3k53XKibh5c&list=RD3k53XKibh5c&start_radio=1" type="audio/mpeg">
        </audio>
    </div>

    <script>
        // Lógica de la Música
        const music = document.getElementById('bgMusic');
        const musicBtn = document.getElementById('musicBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const btnText = document.getElementById('btnText');

        musicBtn.addEventListener('click', () => {
            if (music.paused) {
                music.play();
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
                btnText.innerText = "Pausar Música";
            } else {
                music.pause();
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
                btnText.innerText = "Escuchar Música";
            }
        });

        // Generar Confeti y Globos dinámicamente
        const container = document.getElementById('decorations');
        const colors = ['#38bdf8', '#facc15', '#4ade80', '#f43f5e', '#a855f7', '#fb923c'];
        
        // Crear confeti
        for (let i = 0; i < 40; i++) {
            const confetti = document.createElement('div');
            confetti.classList.add('confetti');
            confetti.style.left = Math.random() * 100 + '%';
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.animationDelay = Math.random() * 4 + 's';
            confetti.style.animationDuration = (Math.random() * 2 + 3) + 's';
            confetti.style.width = confetti.style.height = (Math.random() * 6 + 6) + 'px';
            container.appendChild(confetti);
        }

        // Crear globos flotantes
        for (let i = 0; i < 8; i++) {
            const balloon = document.createElement('div');
            balloon.classList.add('balloon');
            balloon.style.left = (Math.random() * 90) + '%';
            balloon.style.animationDelay = (Math.random() * 6) + 's';
            balloon.style.animationDuration = (Math.random() * 4 + 7) + 's';
            container.appendChild(balloon);
        }
    </script>
</body>
</html>
